<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Arthur Gabriel dos Anjos, Ana Luíza Domingos Xavier, Giovana Gonçalves Silva">
    <meta name="keywords" content="Brasil, Brazil, Folklore, Folclore, Catálogo, Lendas, Mitos, Contos">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="icon" href="/cadastro_login_imagem/icon.ico" type="icon/ico">
    <link rel="stylesheet" href="/css/login.css">

    <title>TBLC - Login</title>
</head>

<body>
    <main id="form_container">
        <div id="form_header">
            <h1 id="form_title">
                LOGIN
            </h1>

            <a href="/cadastro" class="btn-default">
                <i class="fa-solid fa-user-pen"></i>
            </a>

        </div>

        <form action="/login/save" method="POST" id="form">
        <div id="input_container">
                <div class="input-box">
                    <label for="name" class="form-label">
                        PRIMEIRO NOME
                    </label>
                    <div class="input-fild">
                        <input type="text" name="name" id="name" class="form-control" placeholder="Usuario" required>
                        <i class="fa-solid fa-user"></i>
                    </div>
                </div>

                <div class="input-box">
                    <label for="email" class="form-label">
                        E-MAIL
                    </label>
                    <div class="input-fild">
                        <input type="email" name="email" id="email" class="form-control" placeholder="voluntario1@gmail.com" required>
                        <i class="fa-solid fa-envelope"></i>
                    </div>
                </div>

                <div class="input-box">
                    <label for="password" class="form-label">
                        SENHA
                    </label>
                    <div class="input-fild">
                        <input type="password" name="password" id="password" class="form-control" placeholder="********" required>
                        <i class="fa-solid fa-eye-slash password-icon"></i>
                    </div>
                </div>
        </div>

        <button type="submit" class="btn-default">
            <i class="fa-solid fa-check"></i>
            ENTRAR
        </button>

        </form>
    </main>
    <script src="/js/login.js"> </script>
</body>
</html>
